<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>繁星收藏數值計算器｜精簡版</title>
<style>
:root{
  --bg:#080d18;--panel:#101827;--panel2:#151f31;--line:#26354d;
  --text:#eef4ff;--muted:#98a9c3;--blue:#4da3ff;--green:#4ed69c;
  --gold:#f7c65c;--red:#ff6675;--purple:#b993ff;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#070b13,#0b1220 40%,#080d18);color:var(--text);
font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:1440px;margin:auto;padding:18px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:26px;margin:0;margin-right:auto}.back{color:var(--blue);text-decoration:none;font-weight:800}
.note{color:var(--muted);font-size:13px;line-height:1.7}
.toolbar,.summary,.layout>section{background:rgba(16,24,39,.95);border:1px solid var(--line);border-radius:14px}
.toolbar{padding:14px;display:grid;grid-template-columns:minmax(240px,1fr) auto auto auto auto;gap:10px;align-items:center}.slot-input{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap}.slot-input input{width:92px;height:42px;border-radius:9px;border:1px solid #33445f;background:#0d1523;color:var(--text);padding:0 10px;font-size:15px}
input[type="search"],select,button{height:42px;border-radius:9px;border:1px solid #33445f;background:#0d1523;color:var(--text);padding:0 12px;font-size:15px}
button{cursor:pointer;font-weight:800} button:hover{border-color:#5b7aa7}
.primary{background:#183b61;border-color:#2e75b9}.danger{color:#ff9aa5}
.summary{margin-top:12px;padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px}
.kpi small{display:block;color:var(--muted);margin-bottom:4px}.kpi b{font-size:22px;color:var(--green)}
.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,.75fr);gap:14px;margin-top:14px}
section{padding:12px;min-width:0}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.section-head h2{margin:0;font-size:18px}.section-head .count{color:var(--muted);font-size:13px}
.list{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.item{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:10px 12px;border-bottom:1px solid #1f2b3e}
.item:last-child{border-bottom:0}.item:hover{background:#121d2d}
.item input{width:19px;height:19px;margin-top:3px}
.item-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800}
.item-prefix{color:var(--red);font-weight:900;margin-right:4px}
.badge{font-size:11px;border:1px solid #41587a;border-radius:999px;padding:2px 7px;color:#bfd4f5}
.badge.jro{color:#d6c1ff;border-color:#694f98}.effect{margin-top:5px;color:#c4d0e2;font-size:13px;line-height:1.55}
.required-items{margin-top:7px;padding:8px 10px;border-left:3px solid #4da3ff;background:#0c1524;border-radius:7px;color:#dce8fb;font-size:12px;line-height:1.65}
.required-items strong{color:#7dbbff;margin-right:6px}
.required-list{display:flex;flex-wrap:wrap;gap:5px 7px;margin-top:4px}
.req-item{display:inline-block;padding:2px 7px;border:1px solid #304764;border-radius:7px;background:#111d2e;color:#dbe8fb}

.idtxt{color:#7386a3;font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:48vh;overflow:auto;padding-right:2px}
.stat{display:flex;justify-content:space-between;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px}
.stat span{overflow-wrap:anywhere}.stat b{color:var(--green);white-space:nowrap}
.conditional{margin-top:14px}.conditional h3{font-size:15px;margin:0 0 8px}.cond-list{max-height:25vh;overflow:auto;color:#c7d1e1;font-size:12px;line-height:1.55}
.cond-row{padding:7px 2px;border-bottom:1px solid #202c40}.cond-row b{color:var(--gold)}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.footer-note{margin-top:8px;color:#7f91ad;font-size:11px;line-height:1.6}
.subcats{margin-top:12px;padding:12px;background:rgba(16,24,39,.95);border:1px solid var(--line);border-radius:14px}
.subcat-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;color:var(--muted);font-size:14px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid #33445f;background:#edf2fb;color:#1b2a43;font-weight:800;cursor:pointer;transition:.15s}
.chip:hover{transform:translateY(-1px);border-color:#5b7aa7}
.chip.active{background:#2f7ef7;color:#fff;border-color:#2f7ef7;box-shadow:0 8px 18px rgba(47,126,247,.25)}
.chip small{display:inline-block;min-width:22px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.12);color:inherit;font-size:12px;line-height:1.2}
.chip.active small{background:rgba(255,255,255,.2)}
.special-box{margin-top:12px;padding:12px;background:rgba(16,24,39,.95);border:1px solid var(--line);border-radius:14px}
.special-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.special-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:700}
.special-tools{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:950px){
 .toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}
 .summary{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.list{max-height:55vh}
}
@media(max-width:560px){
 .wrap{padding:10px}h1{font-size:21px}.toolbar{grid-template-columns:1fr}
 .summary{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}
}

.page-links{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.page-link{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;border:1px solid #33445f;background:#0d1523;color:#eef4ff;text-decoration:none;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 4px 16px rgba(0,0,0,.16)}
.page-link:hover{border-color:#5b7aa7;filter:brightness(1.06)}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>⭐ 繁星收藏數值計算器</h1>
<div class="page-links"><a class="page-link" href="index.html">🏠 主頁</a><a class="page-link" href="collection.html">📚 收藏區</a></div>
</div>
<div class="toolbar">
<input id="search" placeholder="搜尋收藏名稱、效果、需求道具…" type="search"/>
<select id="groupFilter">
<option value="all">全部收藏</option>
<option value="普通收藏">普通收藏</option>
<option value="JRO收藏">JRO收藏</option>
</select>
<button class="primary" id="selectVisible">勾選目前結果</button>
<button id="onlySelected">只看已勾選：關</button>
<button id="exportExcel">📤 匯出 Excel</button>
<button id="importExcel">📥 匯入 Excel</button>
<input accept=".xls,.html,.htm" id="importExcelFile" style="display:none" type="file"/>
<button class="danger" id="clear">全部清除</button>
<label class="slot-input">普通格子 <input id="normalSlots" min="0" step="1" type="number" value="1000"/></label>
<label class="slot-input">JRO格子 <input id="jroSlots" min="0" step="1" type="number" value="600"/></label>
</div>
<div class="subcats">
<div class="subcat-title">子分類 <span id="subcatMeta"></span></div>
<div class="chips" id="subcatChips"></div>
</div>
<div class="special-box">
<div class="special-head">
<div class="special-title">自選特定分類 <span id="specialMeta"></span></div>
<div class="special-tools">
<button class="primary" id="selectSpecialVisible">一鍵勾選此分類</button>
<button id="clearSpecialFilter">清除此分類</button>
</div>
</div>
<div class="chips" id="specialChips"></div>
</div>
<div class="summary">
<div class="kpi"><small>資料庫收藏</small><b id="totalCount">0</b></div>
<div class="kpi"><small>已勾選收藏</small><b id="selectedCount">0</b></div>
<div class="kpi"><small>普通收藏使用格（重複道具不重算）</small><b id="normalUsed">0 / 1000</b></div>
<div class="kpi"><small>JRO 收藏使用格（重複道具不重算）</small><b id="jroUsed">0 / 600</b></div>
<div class="kpi"><small>重複道具節省格數</small><b id="savedSlots">0</b></div>
</div>
<div class="layout">
<section>
<div class="section-head">
<h2>收藏清單</h2><span class="count" id="visibleCount"></span>
</div>
<div class="list" id="list"></div>
</section>
<section>
<div class="section-head"><h2>已選收藏總能力</h2></div>
<div class="note">
        會自動加總效果文字中可明確判定的「直接 + / - 數值」。
        「每…、當…時、機率、依精煉/素質/裝備數量變動」等條件式效果不直接加總，會列在下方提醒。
      </div>
<div class="stats" id="stats"></div>
<div class="conditional">
<h3>⚠️ 條件式／無法直接加總效果</h3>
<div class="cond-list" id="conditions"></div>
</div>
<div class="footer-note">重新整理頁面後會恢復為全部未勾選；可先匯出 Excel，下次再匯入繼續新增勾選。相同需求道具出現在不同收藏時，格數只計算一次。</div>
</section>
</div>
</div>

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

function normalizeLabel(label){
  label=label.trim().replace(/^[且並和及同時]+/,"").replace(/^(增加|提升|減少)/,"").trim();
  return ALIAS[label]||label;
}
function addStat(map,label,val,isPct){
  label=normalizeLabel(label);
  if(!label || label.length>55)return;
  // Known combined stats: one written bonus applies to both.
  const combo={
    "ATK/MATK":["ATK","MATK"],
    "P.ATK/S.MATK":["P.ATK","S.MATK"],
    "P.Atk/S.M.Atk":["P.ATK","S.MATK"],
    "RES/MRES":["RES","MRES"],
    "近/遠距離傷害":["近距離傷害","遠距離傷害"]
  };
  const labels=combo[label]||[label];
  for(const l0 of labels){
    const l=normalizeLabel(l0);
    const k=l+(isPct?"%":"");
    map.set(k,(map.get(k)||0)+val);
  }
}
function parseDirect(effect){
  const map=new Map(), conditions=[];
  const text=effect.replaceAll("＋","+").replaceAll("－","-").replaceAll("﹑","、");
  const clauses=text.split(/[，。；;]/).map(x=>x.trim()).filter(Boolean);
  for(const clause of clauses){
    if(CONDITIONAL.some(w=>clause.includes(w))){
      conditions.push(clause);
      continue;
    }
    // Split only where each fragment is often an independent stat.
    const parts=clause.split("、");
    let found=false;
    for(const part of parts){
      const rx=/(.{1,55}?)\s*([+-])\s*(\d+(?:\.\d+)?)\s*(%)?/g;
      let m;
      while((m=rx.exec(part))){
        let label=m[1].trim();
        // If previous value text leaked into label, take tail after punctuation.
        label=label.split(/[：:]/).pop().trim();
        const val=(m[2]==="-"?-1:1)*Number(m[3]);
        addStat(map,label,val,!!m[4]);
        found=true;
      }
    }
    if(!found) conditions.push(clause);
  }
  return {map,conditions};
}


function matchSpecial(item,specialKey){
  if(specialKey==="all") return true;
  const effect=String(item.effect||"");

  // 「受到 XXX 傷害」統一歸到減傷；其他自選分類判定時，
  // 先排除這類減傷片段，避免像「受到全階級物理傷害」又被算進階級物理。
  const clauses=effect.split(/[，。；;]/).map(x=>x.trim()).filter(Boolean);
  const isReductionClause=s=>/受到[^，。；]*(?:傷害|攻擊)|(?:傷害|攻擊)[^，。；]*減少|減少[^，。；]*(?:傷害|攻擊)|抗性/.test(s);
  const reductionClauses=clauses.filter(isReductionClause);
  const offensiveEffect=clauses.filter(s=>!isReductionClause(s)).join("，");

  if(specialKey==="減傷") return reductionClauses.length>0;

  const p=parseDirect(offensiveEffect);
  const keys=[...p.map.keys()].map(k=>k.replace(/%$/,""));
  const has=(name)=>keys.includes(name) || offensiveEffect.toLowerCase().includes(String(name).toLowerCase());

  if(specialKey==="爆擊傷害") return has("爆擊傷害");
  if(specialKey==="遠距離攻擊") return has("遠距離傷害") || /遠距離|遠程/.test(offensiveEffect);
  if(specialKey==="近距離") return has("近距離傷害") || /近距離/.test(offensiveEffect);
  if(specialKey==="全屬性魔法傷害") return has("全屬性魔法傷害");
  if(specialKey==="階級物理") return /階級[^，。；]*物理|物理[^，。；]*階級/.test(offensiveEffect);
  if(specialKey==="階級魔法") return /階級[^，。；]*魔法|魔法[^，。；]*階級/.test(offensiveEffect);
  if(specialKey==="MATK"){
    return /(?:^|[^A-Z])(?:S\.)?MATK/i.test(offensiveEffect);
  }
  if(specialKey==="ATK"){
    return /P\.?ATK/i.test(offensiveEffect) || /(?:^|[^A-Z.])ATK/i.test(offensiveEffect);
  }
  if(specialKey==="CRI") return has("CRI");
  if(specialKey==="C.RATE") return has("C.RATE");
  if(specialKey==="ASPD") return /ASPD/i.test(offensiveEffect);
  if(specialKey==="詠唱") return /詠唱/.test(effect);
  return true;
}

    if(g!=="all"&&it.group!==g) continue;
    if(activeSubcat!=="all" && subcatOf(it)!==activeSubcat) continue;
    const reqText=(it.required||[]).join(" ");
    if(q && !(it.name+" "+it.effect+" "+it.dc+" "+it.game+" "+reqText).toLowerCase().includes(q)) continue;
    for(const key of SPECIAL_ORDER){
      if(matchSpecial(it,key)) counter.set(key,(counter.get(key)||0)+1);
    }
  }
  return SPECIAL_ORDER.map(key=>({key,label:SPECIAL_FILTERS[key],count:counter.get(key)||0})).filter(x=>x.count>0);
}
function renderSpecials(){
  const opts=getSpecialOptions();
  if(activeSpecial!=="all" && !opts.some(x=>x.key===activeSpecial)) activeSpecial="all";
  $("#specialMeta").textContent=`(${opts.length})`;
  const total=opts.reduce((a,b)=>a+b.count,0);
  $("#specialChips").innerHTML=[`<button class="chip ${activeSpecial==="all"?"active":""}" data-special="all">全部 <small>${total}</small></button>`].concat(
    opts.map(x=>`<button class="chip ${activeSpecial===x.key?"active":""}" data-special="${esc(x.key)}">${esc(x.label)} <small>${x.count}</small></button>`)
  ).join("");
  $("#specialChips").querySelectorAll(".chip").forEach(btn=>btn.addEventListener("click",()=>{
    activeSpecial=btn.dataset.special;
    renderSpecials();
    renderList();
  }));
}

function getVisible(){
  const q=$("#search").value.trim().toLowerCase();
  const g=$("#groupFilter").value;
  const arr=ITEMS.filter(it=>{
    if(g!=="all"&&it.group!==g)return false;
    const k=keyOf(it);
    if(onlySelected&&!selected.has(k))return false;
    if(activeSubcat!=="all" && subcatOf(it)!==activeSubcat) return false;
    if(activeSpecial!=="all" && !matchSpecial(it,activeSpecial)) return false;
    if(!q)return true;
    const reqText=(it.required||[]).join(" ");
    return (it.name+" "+it.effect+" "+it.dc+" "+it.game+" "+reqText).toLowerCase().includes(q);
  });

  const originalIndex=new Map(ITEMS.map((it,i)=>[keyOf(it),i]));
  arr.sort((a,b)=>{
    const aJro=subcatOf(a)==="JRO裝備";
    const bJro=subcatOf(b)==="JRO裝備";

    if(aJro && bJro){
      const ai=JRO_EQUIP_ORDER[a.name] ?? 9999;
      const bi=JRO_EQUIP_ORDER[b.name] ?? 9999;
      return ai-bi;
    }

    // JRO裝備與其他類別的相對位置維持原本資料順序
    return (originalIndex.get(keyOf(a))??0)-(originalIndex.get(keyOf(b))??0);
  });

  return arr;
}

function renderList(){
  const arr=getVisible();
  $("#visibleCount").textContent=`顯示 ${arr.length.toLocaleString()} 筆`;
  if(!arr.length){
    $("#list").innerHTML='<div class="empty">沒有符合條件的收藏</div>';
    return;
  }
  $("#list").innerHTML=arr.map(it=>{
    const k=keyOf(it), checked=selected.has(k)?"checked":"";
    return `<label class="item">
      <input type="checkbox" data-key="${esc(k)}" ${checked}>
      <div>
        <div class="item-title">
          <span>${JRO_NAME_PREFIX[k]?`<span class="item-prefix">${esc(JRO_NAME_PREFIX[k])}</span>`:""}${esc(it.name)}</span>
          <span class="badge ${it.group==="JRO收藏"?"jro":""}">${esc(it.group)}</span>
          <span class="badge">佔格 ${Number(it.slot||0)}</span>
          <span class="badge">${esc(SUBCAT_LABELS[subcatOf(it)]||subcatOf(it))}</span>
        </div>
        <div class="effect">${esc(it.effect)}</div>
        <div class="required-items">
          <strong>需求：</strong>
          <div class="required-list">
            ${(it.required||[]).length
              ? (it.required||[]).map(x=>`<span class="req-item">${esc(x)}</span>`).join("")
              : `<span class="idtxt">無需求資料</span>`}
          </div>
        </div>
      </div>
    </label>`;
  }).join("");
  $("#list").querySelectorAll('input[type="checkbox"]').forEach(ch=>{
    ch.addEventListener("change",()=>{
      if(ch.checked)selected.add(ch.dataset.key);else selected.delete(ch.dataset.key);
      save();updateSummary();renderTotals();
      if(onlySelected)renderList();
    });
  });
}

function renderTotals(){
  const totals=new Map(), conditionRows=[];
  for(const it of ITEMS){
    if(!selected.has(keyOf(it)))continue;
    const p=parseDirect(it.effect);
    for(const [k,v] of p.map)totals.set(k,(totals.get(k)||0)+v);
    if(p.conditions.length)conditionRows.push({name:it.name,effects:p.conditions.join("；")});
  }
  const order=["STR","AGI","VIT","INT","DEX","LUK","ALL","POW","STA","WIS","SPL","CON","CRT",
               "ATK","ATK%","MATK","MATK%","P.ATK","S.MATK","CRI","C.RATE",
               "MHP","MHP%","MSP","MSP%","ASPD","ASPD%","HIT","FLEE","DEF","MDEF",
               "爆擊傷害%","遠距離傷害%","遠距離物理傷害%","近距離物理傷害%","技能終傷%","技能後延遲%"];
  const entries=[...totals.entries()].filter(([,v])=>Math.abs(v)>1e-9);
  entries.sort((a,b)=>{
    const ai=order.indexOf(a[0]),bi=order.indexOf(b[0]);
    if(ai>=0||bi>=0)return (ai<0?999:ai)-(bi<0?999:bi);
    return a[0].localeCompare(b[0],"zh-Hant");
  });
  $("#stats").innerHTML=entries.length?entries.map(([k,v])=>{
    const pct=k.endsWith("%"), label=pct?k.slice(0,-1):k;
    const sign=v>0?"+":"";
    return `<div class="stat"><span>${esc(label)}</span><b>${sign}${fmt(v)}${pct?"%":""}</b></div>`;
  }).join(""):'<div class="empty" style="grid-column:1/-1">勾選收藏後會顯示總能力</div>';
  $("#conditions").innerHTML=conditionRows.length?conditionRows.map(x=>
    `<div class="cond-row"><b>${esc(x.name)}</b><br>${esc(x.effects)}</div>`
  ).join(""):'<div class="empty">目前沒有條件式效果</div>';
}


function excelEsc(s){
  return String(s??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function exportSelectedExcel(){
  const picked=ITEMS.filter(it=>selected.has(keyOf(it)));
  if(!picked.length){
    alert("目前沒有勾選任何收藏");
    return;
  }

  const rows=picked.map(it=>`
    <tr>
      <td>${excelEsc(it.group)}</td>
      <td>${excelEsc(SUBCAT_LABELS[subcatOf(it)]||subcatOf(it))}</td>
      <td>${excelEsc(it.name)}</td>
      <td>${excelEsc(it.effect)}</td>
      <td>${Number(it.slot||0)}</td>
      <td>${excelEsc((it.required||[]).join("｜"))}</td>
      <td>${excelEsc(keyOf(it))}</td>
    </tr>`).join("");

  const normalUsed=picked.filter(it=>it.group==="普通收藏").reduce((a,it)=>a+(Number(it.slot)||0),0);
  const jroUsed=picked.filter(it=>it.group==="JRO收藏").reduce((a,it)=>a+(Number(it.slot)||0),0);

  const book=`<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="application/vnd.ms-excel; charset=UTF-8">
<title>繁星收藏勾選資料</title>
<style>
table{border-collapse:collapse;font-family:"Microsoft JhengHei",sans-serif}
th,td{border:1px solid #999;padding:6px;vertical-align:top}
th{background:#ddebf7}
.meta{margin-bottom:10px}
</style>
</head>
<body>
<div class="meta">
  <b>繁星收藏勾選資料</b><br>
  已勾選：${picked.length} 筆｜
  普通使用格：${normalUsed}｜
  JRO使用格：${jroUsed}
</div>
<table>
<thead>
<tr>
<th>收藏類型</th>
<th>子分類</th>
<th>收藏名稱</th>
<th>效果</th>
<th>佔格</th>
<th>需求道具</th>
<th>收藏KEY</th>
</tr>
</thead>
<tbody>${rows}</tbody>
</table>
</body>
</html>`;

  const blob=new Blob(["\ufeff",book],{type:"application/vnd.ms-excel;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const now=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
  a.href=url;
  a.download=`繁星收藏_${picked.length}筆_${stamp}.xls`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function importSelectedExcel(file){
  if(!file) return;
  try{
    const text=await file.text();
    const doc=new DOMParser().parseFromString(text,"text/html");
    const table=doc.querySelector("table");
    if(!table) throw new Error("找不到收藏表格");

    const rows=[...table.querySelectorAll("tbody tr")];
    if(!rows.length) throw new Error("Excel 內沒有收藏資料");

    const byKey=new Map(ITEMS.map(it=>[keyOf(it),it]));
    const byName=new Map();
    for(const it of ITEMS){
      const n=it.name.trim();
      if(!byName.has(n)) byName.set(n,[]);
      byName.get(n).push(it);
    }

    let added=0, matched=0, skipped=0;
    for(const tr of rows){
      const cells=[...tr.querySelectorAll("td")].map(td=>td.textContent.trim());
      if(!cells.length) continue;

      const name=cells[2]||"";
      const importedKey=cells[6]||"";
      let item=byKey.get(importedKey);

      if(!item && name){
        const candidates=byName.get(name.trim())||[];
        if(candidates.length===1) item=candidates[0];
        else if(candidates.length>1){
          const group=cells[0]||"";
          item=candidates.find(x=>x.group===group) || candidates[0];
        }
      }

      if(!item){
        skipped++;
        continue;
      }

      matched++;
      const k=keyOf(item);
      if(!selected.has(k)){
        selected.add(k);
        added++;
      }
    }

    save();
    updateSummary();
    renderSubcats();
    renderSpecials();
    renderList();
    renderTotals();

    alert(`匯入完成：辨識 ${matched} 筆，新增勾選 ${added} 筆${skipped?`，未匹配 ${skipped} 筆`:""}。`);
  }catch(err){
    console.error(err);
    alert("匯入失敗：請使用此頁面匯出的 Excel (.xls) 檔案。");
  }finally{
    $("#importExcelFile").value="";
  }
}

function slotItemKey(name){
  return String(name||"")
    .normalize("NFKC")
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase();
}

function calcUsedSlots(group){
  const uniqueItems=new Set();
  let rawSlots=0;
  let hiddenSlots=0;

  for(const it of ITEMS){
    if(!selected.has(keyOf(it)) || it.group!==group) continue;

    const slots=Math.max(0,Number(it.slot)||0);
    rawSlots+=slots;

    const req=(it.required||[]).filter(x=>String(x||"").trim());
    for(const name of req){
      uniqueItems.add(slotItemKey(name));
    }

    // 少數 Excel 收藏的「佔格」大於目前列出的需求道具數，
    // 差額仍保留計入，避免低估實際格數。
    hiddenSlots+=Math.max(0,slots-req.length);
  }

  return {
    used: uniqueItems.size + hiddenSlots,
    raw: rawSlots
  };
}

function updateSummary(){
  $("#totalCount").textContent=ITEMS.length.toLocaleString();
  $("#selectedCount").textContent=selected.size.toLocaleString();

  const normal=calcUsedSlots("普通收藏");
  const jro=calcUsedSlots("JRO收藏");

  const normalUsed=normal.used;
  const jroUsed=jro.used;
  const saved=Math.max(0,(normal.raw+jro.raw)-(normalUsed+jroUsed));

  const normalCap=Math.max(0,Math.floor(Number($("#normalSlots").value)||0));
  const jroCap=Math.max(0,Math.floor(Number($("#jroSlots").value)||0));

  $("#normalUsed").textContent=`${normalUsed.toLocaleString()} / ${normalCap.toLocaleString()}`;
  $("#jroUsed").textContent=`${jroUsed.toLocaleString()} / ${jroCap.toLocaleString()}`;
  $("#savedSlots").textContent=saved.toLocaleString();

  $("#normalUsed").style.color=normalUsed>normalCap?"var(--red)":"var(--green)";
  $("#jroUsed").style.color=jroUsed>jroCap?"var(--red)":"var(--green)";
  $("#savedSlots").style.color=saved>0?"var(--gold)":"var(--green)";
}

$("#exportExcel").addEventListener("click",exportSelectedExcel);
$("#importExcel").addEventListener("click",()=>$("#importExcelFile").click());
$("#importExcelFile").addEventListener("change",e=>importSelectedExcel(e.target.files?.[0]));

$("#normalSlots").addEventListener("input",updateSummary);
$("#jroSlots").addEventListener("input",updateSummary);
$("#search").addEventListener("input",()=>{renderSubcats();renderSpecials();renderList();});
$("#groupFilter").addEventListener("change",()=>{renderSubcats();renderSpecials();renderList();});
$("#onlySelected").addEventListener("click",()=>{
  onlySelected=!onlySelected;
  $("#onlySelected").textContent=`只看已勾選：${onlySelected?"開":"關"}`;
  renderSubcats();
  renderSpecials();
  renderList();
});
$("#selectVisible").addEventListener("click",()=>{
  for(const it of getVisible())selected.add(keyOf(it));
  save();updateSummary();renderSubcats();renderSpecials();renderList();renderTotals();
});
$("#selectSpecialVisible").addEventListener("click",()=>{
  const arr=getVisible();
  if(!arr.length){ alert("目前這個特定分類沒有可勾選的收藏"); return; }
  for(const it of arr) selected.add(keyOf(it));
  save();updateSummary();renderSubcats();renderSpecials();renderList();renderTotals();
});
$("#clearSpecialFilter").addEventListener("click",()=>{
  if(activeSpecial==="all"){
    alert("請先選擇一個特定分類");
    return;
  }

  let cleared=0;
  for(const it of ITEMS){
    if(!matchSpecial(it,activeSpecial)) continue;

    const g=$("#groupFilter").value;
    if(g!=="all" && it.group!==g) continue;
    if(activeSubcat!=="all" && subcatOf(it)!==activeSubcat) continue;

    const q=$("#search").value.trim().toLowerCase();
    if(q){
      const reqText=(it.required||[]).join(" ");
      const hay=(it.name+" "+it.effect+" "+it.dc+" "+it.game+" "+reqText).toLowerCase();
      if(!hay.includes(q)) continue;
    }

    const k=keyOf(it);
    if(selected.delete(k)) cleared++;
  }

  save();
  updateSummary();
  renderSubcats();
  renderSpecials();
  renderList();
  renderTotals();
});
$("#clear").addEventListener("click",()=>{
  if(!confirm("確定清除全部已勾選收藏？"))return;
  selected.clear();save();updateSummary();renderSubcats();renderSpecials();renderList();renderTotals();
});

updateSummary();renderSubcats();renderSpecials();renderList();renderTotals();
</script>
</body>
</html>
